<div class="page-container">

    <div class="page-header">

        <div>

            <h1>Tax Settings</h1>

            <p>
                Configure tax calculation and default tax rates.
            </p>

        </div>

    </div>


    <form [formGroup]="taxForm" (ngSubmit)="save()">

        <section class="form-card">

            <div class="card-header">

                <h2>Tax Configuration</h2>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Tax System <span>*</span>
                    </label>

                    <select formControlName="taxSystem">

                        <option value="GST">
                            GST
                        </option>

                        <option value="VAT">
                            VAT
                        </option>

                        <option value="None">
                            No Tax
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Default Tax Rate (%) <span>*</span>
                    </label>

                    <input type="number" min="0" max="100" step="0.01" formControlName="defaultTaxRate" />

                </div>

            </div>

        </section>


        <section class="form-card">

            <div class="card-header">

                <h2>Tax Behavior</h2>

            </div>


            <div class="settings-list">

                <label class="setting-row">

                    <div>

                        <strong>
                            Enable Tax
                        </strong>

                        <span>
                            Apply tax calculations to invoices and sales.
                        </span>

                    </div>

                    <input type="checkbox" formControlName="enableTax" />

                </label>


                <label class="setting-row">

                    <div>

                        <strong>
                            Tax Inclusive Pricing
                        </strong>

                        <span>
                            Treat entered selling prices as tax-inclusive.
                        </span>

                    </div>

                    <input type="checkbox" formControlName="taxInclusive" />

                </label>

            </div>

        </section>


        <section class="form-card">

            <div class="card-header">

                <h2>Common GST Rates</h2>

                <p>
                    Commonly used GST rates in the application.
                </p>

            </div>


            <div class="tax-rate-grid">

                <div class="tax-rate-card" *ngFor="let tax of taxRates">

                    <strong>
                        {{ tax.name }}
                    </strong>

                    <span>
                        {{ tax.rate }}%
                    </span>

                </div>

            </div>

        </section>


        <div *ngIf="saved" class="success-message">
            Tax settings saved successfully.
        </div>


        <div class="form-actions">

            <button type="submit" class="btn btn-primary" [disabled]="saving">

                {{
                saving
                ? 'Saving...'
                : 'Save Changes'
                }}

            </button>

        </div>

    </form>

</div>
